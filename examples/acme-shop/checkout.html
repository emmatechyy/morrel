<title>Checkout · Acme Shop</title><link rel="stylesheet" href="/style.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("acme.theme"))||"light"}catch(e){}</script></head><body data-page="checkout"><main><h1>Checkout</h1><p class="sub" id="sample" hidden>Your cart is empty, so this is a sample order.</p><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:28px"><div class="panel" id="lines"></div><div><form id="couponform" class="form"><label for="code">Coupon code</label><div style="display:flex;gap:8px"><input id="code" placeholder="e.g. SAVE10"><button type="submit" style="margin:0;width:auto">Apply</button></div><p class="notice" id="couponmsg"></p></form><p class="muted notice" id="shipnote"></p></div></div></main><script src="/shop.config.js"></script><script src="/app.js"></script></body></html>
